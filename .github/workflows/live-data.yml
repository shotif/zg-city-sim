name: Live data

# Copies the City of Zagreb's road closures (data.zagreb.hr "prometnice", refreshed every
# 3 minutes, no CORS headers) and DHMZ's hourly weather observations for Zagreb
# (vrijeme.hr, no CORS headers) to the live-data branch, where the app reads them from
# raw.githubusercontent.com. The branch holds a single commit, replaced on every run.
# data.zagreb.hr now and then answers 502 Bad Gateway after about a minute: each request is
# tried three times, and a feed that still cannot be had keeps the file of the last run
# (with its own `fetched` time, which the app shows). The run fails only when neither feed
# could be fetched.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  closures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch road closures
        # The weather is published even if the closures cannot be had.
        continue-on-error: true
        run: |
          mkdir -p out
          python3 - <<'EOF'
          import datetime, json, time, urllib.error, urllib.request

          def get(url, waits=(20, 60)):
              # Retried on server errors, rate limits and timeouts (data.zagreb.hr's 502s).
              for wait in (*waits, None):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "zg-city-sim live data"})
                      with urllib.request.urlopen(req, timeout=60) as response:
                          return response.read()
                  except (urllib.error.URLError, TimeoutError) as e:
                      code = getattr(e, "code", None)
                      if wait is None or (code is not None and code < 500 and code != 429):
                          raise
                      print(f"{url}: {e}; trying again in {wait} s")
                      time.sleep(wait)

          package = json.loads(get("https://data.zagreb.hr/api/3/action/package_show?id=prometnice"))
          url = next(r["url"] for r in package["result"]["resources"] if r.get("format", "").upper() == "JSON")
          raw = json.loads(get(url))
          keep = ("type", "subtype", "street", "polyline", "direction", "expectedStartTime", "expectedEndTime")
          out = {
              "source": "Grad Zagreb, Zatvaranje prometnica na području Grada Zagreba (data.zagreb.hr), Otvorena dozvola",
              "fetched": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "closures": [{k: c.get(k) for k in keep} for c in raw if isinstance(c, dict)],
          }
          with open("out/closures.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)
          print(len(out["closures"]), "closures")
          EOF

      - name: Fetch the weather in Zagreb
        # The closures are published even if the weather cannot be had.
        continue-on-error: true
        run: |
          mkdir -p out
          python3 - <<'EOF'
          import datetime, json, urllib.request
          import xml.etree.ElementTree as ET

          import time, urllib.error

          def get(url, waits=(20, 60)):
              for wait in (*waits, None):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "zg-city-sim live data"})
                      with urllib.request.urlopen(req, timeout=60) as response:
                          return response.read()
                  except (urllib.error.URLError, TimeoutError) as e:
                      code = getattr(e, "code", None)
                      if wait is None or (code is not None and code < 500 and code != 429):
                          raise
                      print(f"{url}: {e}; trying again in {wait} s")
                      time.sleep(wait)

          root = ET.fromstring(get("https://vrijeme.hr/hrvatska_n.xml"))

          def number(text):
              try:
                  return float((text or "").strip())
              except ValueError:
                  return None

          stations = []
          for city in root.iter("Grad"):
              name = (city.findtext("GradIme") or "").strip()
              if not name.startswith("Zagreb"):
                  continue
              data = city.find("Podatci")
              if data is None:
                  continue
              stations.append({
                  "name": name,
                  "lat": number(city.findtext("Lat")),
                  "lon": number(city.findtext("Lon")),
                  "temperature": number(data.findtext("Temp")),
                  "humidity": number(data.findtext("Vlaga")),
                  "pressure": number(data.findtext("Tlak")),
                  "windDirection": (data.findtext("VjetarSmjer") or "").strip(),
                  "wind": number(data.findtext("VjetarBrzina")),
                  "weather": (data.findtext("Vrijeme") or "").strip(),
                  "symbol": (data.findtext("VrijemeZnak") or "").strip(),
              })
          day = (root.findtext("DatumTermin/Datum") or "").strip()
          hour = (root.findtext("DatumTermin/Termin") or "").strip()
          out = {
              "source": "DHMZ (Državni hidrometeorološki zavod), vrijeme.hr: weather observations in Croatia",
              "fetched": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "observed": f"{day} {hour}:00",
              "stations": stations,
          }
          if not stations:
              raise SystemExit("no Zagreb stations in the feed")
          with open("out/weather.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)
          print(len(stations), "stations")
          EOF

      - name: Publish to the live-data branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls *.json > /dev/null 2>&1; then
            echo "::error::Neither the road closures nor the weather could be fetched"
            exit 1
          fi
          git init -q -b live-data
          # A feed that could not be fetched keeps the file of the last run.
          if git fetch -q --depth=1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data; then
            for f in closures.json weather.json; do
              if [ ! -f "$f" ] && git cat-file -e "FETCH_HEAD:$f" 2> /dev/null; then
                git show "FETCH_HEAD:$f" > "$f"
                echo "::warning::$f could not be fetched; the last run's is kept"
              fi
            done
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Road closures and weather $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
